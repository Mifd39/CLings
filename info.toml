hint = "for (int i = 0; i < 10; i++) { ... }"

[[exercises]]
name = "pointers1"
path = "exercises/pointers/pointers1.c"
mode = "run"
hint = "Use & to get the address of a variable."

[[exercises]]
name = "arrays1"
path = "exercises/arrays/arrays1.c"
mode = "run"
hint = "int numbers[5] = {1, 2, 3, 4, 5};"

[[exercises]]
name = "strings1"
path = "exercises/strings/strings1.c"
mode = "run"
