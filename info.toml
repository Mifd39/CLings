hint = "Functions in C need a return type, a name, and parentheses."

[[exercises]]
name = "if1"
path = "exercises/if/if1.c"
mode = "run"
hint = "if (condition) { ... } else { ... }"

[[exercises]]
name = "loops1"
path = "exercises/loops/loops1.c"
