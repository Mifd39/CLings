name: Rust

on:
  push:
    branches: [ "create-clings-c-learning-tool-7443639577374327686" ]
  pull_request:
    branches: [ "create-clings-c-learning-tool-7443639577374327686" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
